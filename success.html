
<!DOCTYPE html>

<head>

    <title>Registration Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

        }

            border-radius: 8px;

<body>

        <h1>Registration Successful!</h1>
        <p>Your registration has been submitted successfully.</p>
